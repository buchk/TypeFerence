schemaVersion: 1
environment: local
artifacts:
  helio/works/agents/executive-assistant@1.0.0:
    modes: []
  helio/works/agents/payments-repo-agent@1.0.0:
    modes: [manual]
providers:
  payments-agent:
    kind: mcp
    transport: http
    url: https://agents.helio.example/payments-repo-agent/mcp
  repository-signals:
    kind: mcp
    transport: stdio
    command: helio-repository-signals
    args: [--bundle, "{bundle}"]
    environment:
      HELIO_REPOSITORY_TOKEN:
        fromEnvironment: HELIO_REPOSITORY_TOKEN
toolBindings:
  helio/works/tools/payments-repository-agent@1.0.0:
    provider: payments-agent
    remoteName: repository_status
  helio/works/tools/repository-signals@1.0.0:
    provider: repository-signals
    remoteName: repository_signals
