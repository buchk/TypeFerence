name: ci

on:
  push:
  pull_request:

jobs:
  go-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: go
      - run: go vet ./...
        working-directory: go
      - run: go test ./...
        working-directory: go
      - name: Static binaries (CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/typeference ./cmd/typeference
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/typeference-lsp ./cmd/typeference-lsp
        working-directory: go
      - name: Playground builds (js/wasm bridge and example packer)
        run: |
          GOOS=js GOARCH=wasm go build ./cmd/typeference-wasm
          go run ./cmd/playground-pack -root .. -out /tmp/examples.json
        working-directory: go

  # Determinism suite: the Go compiler compiles the version 7 fixture corpus in
  # conformance/ and must reproduce the committed digests on every platform
  # (ADR-0014). The Helio reference test (go test ./internal/compile) also
  # byte-compares the committed dist/ on every platform.
  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - run: go test ./conformance ./internal/compile -v
        working-directory: go

  # The repository-root AGENTS.md and dist-maintainer are build artifacts of
  # agents/maintainer (the self-hosted maintainer definition). Drift between
  # the definition and its committed artifacts is a broken build.
  selfhost-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - name: Recompile maintainer definition and diff committed artifacts
        run: go run ./cmd/typeference diff ../agents/maintainer --against ../dist-maintainer
        working-directory: go
      - name: Root AGENTS.md is the compiled agent file without its frontmatter
        run: |
          awk 'n >= 2 && (seen || $0 != "") { seen = 1; print } /^---$/ { n++ }'             dist-maintainer/agent-plugin/typeference-maintainer/com.github.copilot/agents/typeference-maintainer.agent.md             | cmp - AGENTS.md

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements-docs.txt
      - run: python tools/render_whitepaper.py
      - run: cp output/pdf/typeference-whitepaper.pdf /tmp/typeference-whitepaper-first.pdf
      - run: python tools/render_whitepaper.py
      - run: cmp /tmp/typeference-whitepaper-first.pdf output/pdf/typeference-whitepaper.pdf
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pdfinfo output/pdf/typeference-whitepaper.pdf
