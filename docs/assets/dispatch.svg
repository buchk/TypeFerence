<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Runtime tool import binding</title><desc id="desc">A declared skill tool import is linked to an explicit MCP provider and remote tool name.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#646b88"/></marker><style>.box{fill:#f7f8fc;stroke:#4455aa;stroke-width:2}.accent{fill:#f1e9ff;stroke:#8154b5;stroke-width:2}.dark{fill:#171a2b}.t{font:600 17px sans-serif;fill:#171a2b}.w{fill:white}.s{font:13px sans-serif;fill:#555b75}.line{stroke:#646b88;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="box" x="20" y="120" rx="12" width="245" height="90"/><text class="t" x="142" y="153" text-anchor="middle">Skill tool import</text><text class="s" x="142" y="179" text-anchor="middle">payments-repository-agent</text><text class="s" x="142" y="197" text-anchor="middle">@1.0.0</text>
  <path class="line" d="M265 165H340"/><rect class="dark" x="340" y="105" rx="12" width="250" height="120"/><text class="t w" x="465" y="139" text-anchor="middle">Link binding</text><text class="s w" x="465" y="166" text-anchor="middle">provider: payments-agent</text><text class="s w" x="465" y="194" text-anchor="middle">remote: repository_status</text>
  <path class="line" d="M590 165H665"/><rect class="accent" x="665" y="55" rx="12" width="315" height="220"/><text class="t" x="822" y="91" text-anchor="middle">MCP provider</text><text class="s" x="705" y="126">- authored HTTPS address</text><text class="s" x="705" y="154">- environment references</text><text class="s" x="705" y="182">- provider remote name</text><text class="s" x="705" y="210">- target-native config</text><text class="s" x="705" y="238">- link provenance</text>
</svg>
